spring.application.name=QuizBackend

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quiz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JWT ---
# Raw UTF-8 bytes of this value key the HS256 signature, so it must be at least
# 32 characters. Generate with: openssl rand -base64 48
# No default: an unset secret must fail startup, never fall back to a forgeable value.
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:quiz-backend}
# Access token lifetime in ms (15 minutes). Short on purpose: it cannot be revoked.
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
# Refresh token lifetime in ms (30 days). Revocable, rotated on every use.
jwt.refresh-expiration=${JWT_REFRESH_TTL_MS:2592000000}

# --- Refresh token cookie ---
auth.cookie.name=refresh_token
auth.cookie.path=/api/auth
# Must be true anywhere but local http development.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# --- CORS (credentials require explicit origins, never *) ---
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Where the browser lands after Google sign-in. Carries no parameters: the refresh
# cookie is set on the redirect itself, and the frontend then calls /api/auth/refresh.
auth.oauth2.success-redirect=${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth2/success}
auth.oauth2.failure-redirect=${OAUTH_FAILURE_REDIRECT_URI:http://localhost:5173/oauth2/failure}

# --- Flyway ---
spring.flyway.enabled=true
# Existing databases created by ddl-auto get stamped at V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# -- GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- JPA / Hibernate ---
# Flyway owns the schema now; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
