spring.application.name=QuizBackend

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quiz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JWT ---
# Raw UTF-8 bytes of this value key the HS256 signature, so it must be at least
# 32 characters. Generate with: openssl rand -base64 48
# No default: an unset secret must fail startup, never fall back to a forgeable value.
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:quiz-backend}
# Access token lifetime in ms (15 minutes). Short on purpose: it cannot be revoked.
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
# Refresh token lifetime in ms (30 days). Revocable, rotated on every use.
jwt.refresh-expiration=${JWT_REFRESH_TTL_MS:2592000000}

# --- Refresh token cookie ---
auth.cookie.name=refresh_token
auth.cookie.path=/api/auth
# Must be true anywhere but local http development.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# --- CORS (credentials require explicit origins, never *) ---
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Where the browser lands after Google sign-in. Carries no parameters: the refresh
# cookie is set on the redirect itself, and the frontend then calls /api/auth/refresh.
auth.oauth2.success-redirect=${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth2/success}
auth.oauth2.failure-redirect=${OAUTH_FAILURE_REDIRECT_URI:http://localhost:5173/oauth2/failure}

# --- Flyway ---
spring.flyway.enabled=true
# Existing databases created by ddl-auto get stamped at V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# -- GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- JPA / Hibernate ---
# Flyway owns the schema now; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- File storage ---
app.file-storage.location=${FILE_STORAGE_LOCATION:./uploads}
# Per-file cap matches the 10MB the upload form allows; a whole track may carry several.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
# --- Daily schedule ---
# The one time zone for every user: "today", the day number and the daily jobs.
app.schedule.zone=${APP_SCHEDULE_ZONE:Asia/Kolkata}

# --- Quiz generation ---
# The number of questions in one quiz.
app.quiz.question-count=10

# --- Quiz job queue ---
# When the planner adds the day's quizzes to the queue, in app.schedule.zone.
app.quiz.jobs.plan-morning-cron=0 0 6 * * *
app.quiz.jobs.plan-evening-cron=0 0 17 * * *
# How often the queue looks for waiting jobs.
app.quiz.jobs.poll-delay=PT10S
# Model calls at the same time. Keep within the Gemini rate limit of your plan.
app.quiz.jobs.workers=3
app.quiz.jobs.max-attempts=4
app.quiz.jobs.retry-delay=PT1M

# --- Daily contest ---
# Times in app.schedule.zone. The crons below must match them.
app.contest.opens-at=18:00
# Users can start until 18:05. Each attempt has 10 minutes. The contest closes at 18:15.
app.contest.start-window=PT5M
app.contest.attempt-time=PT10M
app.contest.length=PT15M
app.contest.open-cron=0 0 18 * * *
# 30 seconds after the close, so every deadline has passed.
app.contest.close-cron=30 15 18 * * *

# --- Daily email (Resend) ---
# Without a key, emails are planned but not sent.
app.email.resend-api-key=${RESEND_API_KEY:}
# Resend's test sender delivers only to the email address of your Resend account.
# With a verified domain, use for example: Quiz <daily@yourdomain.com>
app.email.from=${EMAIL_FROM:Quiz <onboarding@resend.dev>}
# Where the links in the email go.
app.email.app-url=${APP_URL:http://localhost:5173}
app.email.api-url=${API_URL:http://localhost:8080}
app.email.plan-cron=0 0 6 * * *
app.email.poll-delay=PT30S
app.email.send-interval=PT0.6S

# --- Scheduler ---
# Several threads, so a long run (the 06:00 emails) never delays another job.
spring.task.scheduling.pool.size=4
